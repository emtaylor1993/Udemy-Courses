#
# Description:
# Helm values configuration for deploying the Bitnami Keycloak chart.
#
# This file:
# - Configures global PostgreSQL credentials for both internal and external use.
# - Sets the Keycloak admin user credentials for accessing the web UI.
# - Enables and configures the internal PostgreSQL instance used by Keycloak.
# - Exposes the Keycloak service on NodePort 30080 for local browser access.
# - Injects additional environment variables to optimize Keycloak's runtime behavior.
# ------------------------------------------------------------------------------

# Global PostgreSQL settings
global:
  postgresql:
    auth:
      username: bn_keycloak
      password: bn_keycloak
      database: bitnami_keycloak

# Keycloak Admin User Configuration
auth:
  adminUser: admin
  adminPassword: admin

# PostgreSQL Specific Configuration
postgresql:
  enabled: true
  auth:
    username: bn_keycloak
    password: bn_keycloak
    database: bitnami_keycloak

# Kubernetes Service Configuration
service:
  type: NodePort
  nodePorts:
    http: 30080

# Additional Keycloak Environment Variables
extraEnvVars:
  # Enable production mode to prevent thread blocking
  - name: KC_PRODUCTION
    value: "true"

  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_HTTP_ENABLED
    value: "true"

  - name: VERTX_WORKER_POOL_SIZE
    value: "20"
  - name: VERTX_EVENT_LOOP_POOL_SIZE
    value: "8"