# Description:
# Kubernetes Secret definition for grade-submission-api credentials.
#
# The Secret:
# - Stores sensitive data (MongoDB username and password) in base64-encoded form.
# - Provides credentials for the grade-submission-api to connect securely to MongoDB.
# - Can be mounted as environment variables or volumes in the API pod.
# - Uses type Opaque for generic key-value pairs.
# ------------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: grade-submission-api-secret
  namespace: grade-submission
type: Opaque
data:
  MONGODB_USER: 'YWRtaW4='
  MONGODB_PASSWORD: 'cGFzc3dvcmQxMjM='