# ------------------------------------------------------------------------------
# File: grade-submission-api-deployment.yaml
#
# Author: Emmanuel Taylor
# Created: July 9, 2025
# Modified: July 23, 2025
#
# Description:
# Kubernetes Deployment manifest for the grade-submission-api microservice.
#
# This Deployment:
# - Ensures a single replica of the grade-submission-api pod runs in the 
#   grade-demo namespace.
# - Labels the pod with app=grade-submission for selector and service targeting.
# - Deploys a container containing the grade-submission-api image.
# - Exposes container port 3000 for internal service communication.
# - Secures the environment with a kube-rbac-proxy container from Google on
#   port 8444 to enforce Kubernetes RBAC.
# ------------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-submission-api
  namespace: grade-demo
  labels:
    app: grade-submission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grade-submission
  template:
    metadata:
      labels:
        app: grade-submission
    spec:
      serviceAccountName: grade-service-proxy     # Specifies the service account that this pod will use for RBAC.
      containers:

      # Grade Submission API Container specifications.
      - name: grade-submission-api
        image: rslim087/kubernetes-course-grade-submission-api:stateless
        resources:
          requests:
            memory: "128Mi"
            cpu: "128m"
          limits:
            memory: "128Mi"
        ports:
          - containerPort: 3000
      
      # Kubernetes RBAC Proxy Container specifications.
      - name: kube-rbac-proxy
        image: gcr.io/kubebuilder/kube-rbac-proxy:v0.14.0
        args:
          - "--secure-listen-address=0.0.0.0:8443"  # Proxy listens on all interfaces using HTTPS on port 8443.
          - "--upstream=http://127.0.0.1:3000/"     # Forwards authenticated requests to our internal service on port 3000.
          - "--logtostderr=true"                    # Outputs logs to standard error.
          - "--v=10"                                # Verbosity level.
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "128Mi"
        ports:
          - containerPort: 8443
            name: https
          