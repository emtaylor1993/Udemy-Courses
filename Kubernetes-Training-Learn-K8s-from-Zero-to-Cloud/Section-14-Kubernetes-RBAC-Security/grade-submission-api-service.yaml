# Description:
# Kubernetes Service definition for the grade-submission-api microservice.
#
# This Service:
# - Exposes the grade-submission-api pod externally using a NodePort.
# - Forwards external traffic from port 31000 on each cluster node to port 3000
#   on the associated container.
# - Uses a selector (app=grade-submission) to target the correct pod.
# - Enables access to the API at localhost:31000.
# ------------------------------------------------------------------------------

apiVersion: v1
kind: Service
metadata:
  name: grade-submission-api
  namespace: grade-demo
spec:
  type: NodePort
  selector:
    app: grade-submission
  ports:
  - port: 8443
    targetPort: https # Forwards traffic to "https" defined in the deployment.yaml.
    nodePort: 31000