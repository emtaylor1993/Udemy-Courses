# ------------------------------------------------------------------------------
# File: grade-service-account-token.yaml
#
# Author: Emmanuel Taylor
# Created: July 23, 2025
# Modified: July 23, 2025
#
# Description:
# This manifest defines a Kubernetes Secret of type `service-account-token`,
# which is automatically populated by the Kubernetes API server.
#
# It is linked to the `grade-service-account` and contains:
# - A JWT token for authenticating to the Kubernetes API.
# - The namespace in which the service account exists.
# - The cluster's CA certificate (`ca.crt`) for verifying API server identity.
# ------------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: grade-service-account-token
  namespace: grade-demo
  annotations:
    kubernetes.io/service-account.name: grade-service-account
type: kubernetes.io/service-account-token