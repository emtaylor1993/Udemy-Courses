# Description:
# Kubernetes Deployment definition for the grade-submission-portal application.
# 
# This Deployment ensures one replica of the grade-submission-portal pod
# is running in the grade-submission namespace.
#
# The Deployment:
# - Manages the frontend portal for the grade-submission app.
# - Sets an environment variable to connect to the grade-submission-api service.
# - Uses resource requests and limits to control memory and CPU usage.
# - Exposes container port 5001 for internal communication.
# - Leverages labels for organizing and selecting pods.
#-----------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-submission-portal
  namespace: grade-submission
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: grade-submission-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grade-submission
        app.kubernetes.io/component: frontend
        app.kubernetes.io/instance: grade-submission-portal
    spec:
      containers:
      - name: grade-submission-portal
        image: rslim087/kubernetes-course-grade-submission-portal
        env:
          - name: GRADE_SERVICE_HOST
            value: grade-submission-api
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "128Mi"
        ports:
          - containerPort: 5001