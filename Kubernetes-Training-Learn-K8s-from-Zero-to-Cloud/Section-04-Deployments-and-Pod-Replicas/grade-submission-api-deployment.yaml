# Description:
# Kubernetes Deployment definition for the grade-submission-api application.
# 
# This Deployment ensures two replicas of the grade-submission-api pod
# are running in the grade-submission namespace.
#
# The Deployment:
# - Automatically manages scaling, rolling updates, and self-healing of pods.
# - Uses labels for organizing and selecting pods.
# - Specifies resource requests and limits to control memory and CPU usage.
# - Exposes port 3000 from each container for internal communication.
#-----------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-submission-api
  namespace: grade-submission
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/instance: grade-submission-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grade-submission
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: grade-submission-api
    spec:
      containers:
      - name: grade-submission-api
        image: rslim087/kubernetes-course-grade-submission-api:stateless
        resources:
          requests:
            memory: "128Mi"
            cpu: "128m"
          limits:
            memory: "128Mi"
        ports:
          - containerPort: 3000