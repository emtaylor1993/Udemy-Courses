# Description:
# Kubernetes Secret definition for MongoDB root credentials in the grade-submission namespace.
#
# The Secret:
# - Stores sensitive MongoDB root username and password in base64-encoded form.
# - Provides secure credentials for initializing MongoDB's root user.
# - Can be consumed by the MongoDB StatefulSet as environment variables or mounted volumes.
# - Uses type Opaque for generic key-value pair secrets.
# ------------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: grade-submission
type: Opaque
data:
  MONGO_INITDB_ROOT_USERNAME: 'YWRtaW4='
  MONGO_INITDB_ROOT_PASSWORD: 'cGFzc3dvcmQxMjM='