# Description:
# Kubernetes Secret definition for MongoDB user credentials.
#
# This Secret:
# - Stores a base64-encoded password used for accessing the MongoDB database.
# - Uses type `Opaque`, suitable for generic key-value secrets.
# - Is placed in the `mongodb` namespace for logical separation.
# - Can be referenced by StatefulSets, Deployments, or Helm charts to inject
#   the password into environment variables or mount it as a file in pods.
# -------------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: mongodb-user-password
  namespace: mongodb
type: Opaque
data:
  password: 'cGFzc3dvcmQxMjM='