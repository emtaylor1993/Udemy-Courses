# -------------------------------------------------------------------------------------
# File: mongodb-grade-submission.yaml
#
# Author: Emmanuel Taylor
# Created: July 8, 2025
# Modified: July 8, 2025
#
# Description:
# Kubernetes Custom Resource (CR) definition for deploying a MongoDB Community ReplicaSet
# using the MongoDB Community Operator.
#
# This MongoDBCommunity CR:
# - Provisions a single-member MongoDB ReplicaSet in the `mongodb` namespace.
# - Sets the MongoDB version to 6.0.5 and enables SCRAM authentication.
# - Creates a user named `user` in the `grades` database with readWrite access.
# - Pulls the user password from a pre-existing Kubernetes Secret (`mongodb-user-password`).
# - Stores SCRAM credentials in a separate secret (`mongodb-grade-submission`).
# - Customizes the underlying StatefulSet, specifically the `mongodb-agent` container image.
#
# Prerequisites:
# - MongoDB Community Operator must be installed in the cluster.
# - Secret `mongodb-user-password` must exist in the `mongodb` namespace.
#
# Notes:
# - This setup provides production-ready MongoDB with automated replica management,
#   security configuration, and optional persistent storage.
# -------------------------------------------------------------------------------------

apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: mongodb-grade-submission
  namespace: mongodb
spec:
  members: 1
  type: ReplicaSet
  version: "6.0.5"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: user
      db: grades
      passwordSecretRef:
        name: mongodb-user-password
      roles:
        - name: readWrite
          db: grades
      scramCredentialsSecretName: mongodb-grade-submission

  statefulSet:
    spec:
      template:
        # Adds a custom volume to the pods
        spec:
          containers:
          - name: mongodb-agent
            image: "quay.io/mongodb/mongodb-agent-ubi:12.0.32.7857-1"