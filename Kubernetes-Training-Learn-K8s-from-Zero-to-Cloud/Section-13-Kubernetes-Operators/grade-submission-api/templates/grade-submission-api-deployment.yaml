# File: grade-submission-api-deployment.yaml
#
# Author: Emmanuel Taylor
# Created: July 5, 2025
# Modified: July 5, 2025
#
# Description:
# Helm template for the Kubernetes Deployment that manages the grade-submission-api
# microservice (stateless-v3) in the grade-submission namespace.
#
# This Deployment:
# - Ensures two replicas of the grade-submission-api pods are running.
# - Uses a RollingUpdate strategy to achieve zero-downtime updates:
#   > maxUnavailable: 50% allows up to 1 pod to be unavailable during updates.
#   > maxSurge: 1 allows up to 1 additional pod above desired replicas during updates.
# - Defines liveness and readiness probes:
#   > Liveness probe checks /healthz to automatically restart unhealthy pods.
#   > Readiness probe checks /readyz to ensure pods only serve traffic when ready.
# - Externalizes configuration using environment variables from ConfigMap and Secret.
# - Specifies resource requests and limits for controlled CPU and memory usage.
# - Exposes the application over a defined HTTP port for internal communication.
# - Applies labels for selection, organization, and service targeting.
# - Uses Helm templating to dynamically set names, namespaces, images, and settings.
# ------------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.microservice.name }}
  namespace: {{ .Values.microservice.namespace }}
spec:
  replicas: {{ .Values.microservice.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.microservice.name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 1 # Ensures we do not have more than three replicas running.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grade-submission
        app.kubernetes.io/component: backend
        app.kubernetes.io/instance: {{ .Values.microservice.name }}
    spec:
      containers:
      - name: {{ .Values.microservice.name }}
        image: {{ .Values.workload.image }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.workload.port }}
          initialDelaySeconds: {{ .Values.workload.livenessDelay }}
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.workload.port }}
          periodSeconds: 5
        envFrom:
          - secretRef:
              name: {{ .Values.microservice.name }}-secret
        resources:
          requests:
            memory: {{ .Values.workload.resources.memory }}
            cpu: {{ .Values.workload.resources.cpu }}
          limits:
            memory: {{ .Values.workload.resources.memory }}
        ports:
          - name: http
            containerPort: {{ .Values.workload.port }}