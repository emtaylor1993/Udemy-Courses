# ------------------------------------------------------------------------------
# File: values.yaml
#
# Author: Emmanuel Taylor
# Created: July 5, 2025
# Modified: July 7, 2025
#
# Description:
# Default values for the Helm chart that deploys the grade-submission-api 
# microservice. These values define general service settings, container 
# workload configuration, environment variables, and sensitive data for 
# connecting to MongoDB.
#
# This values file:
# - Defines microservice name, namespace, and replica count.
# - Specifies the container image, port, resource limits/requests, and probes.
# - Externalizes MongoDB connection settings via environment variables.
# - Stores base64-encoded sensitive data for secure use in Kubernetes Secrets.
# - Enables Helm templating to dynamically apply these settings across manifests.
# ------------------------------------------------------------------------------

microservice: ## General service details.
  name: grade-submission-api
  namespace: grade-submission
  replicas: 2

workload:     ## Container specific details.
  image: rslim087/kubernetes-course-grade-submission-api:stateless-v4
  port: 3000
  resources:
    memory: "128Mi"
    cpu: "128m"
  livenessDelay: 15

secrets:      ## Sensitive data.
  MONGODB_URI: 'mongodb://user:password123@mongodb-grade-submission-svc.mongodb.svc.cluster.local:27017/grades'