# Description:
# Kubernetes StatefulSet definition for MongoDB within the grade-submission namespace.
#
# The StatefulSet:
# - Manages a single replica (pod) of MongoDB, ensuring stable identity and storage.
# - Associates the pod with a headless Service (mongodb) for stable network identity.
# - Provides persistent storage using a volumeClaimTemplate (1Gi, ReadWriteOnce).
# - Sets environment variables for initializing the root MongoDB user.
# - Ensures pod identity and volume association are stable across rescheduling.
# - Exposes MongoDB on port 27017 within the cluster.
# ------------------------------------------------------------------------------

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: grade-submission
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: mongodb
  serviceName: mongodb
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grade-submission
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:4.4
        envFrom:
          - secretRef:
              name: mongodb-secret
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongodb-persistent-storage
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: mongodb-persistent-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
