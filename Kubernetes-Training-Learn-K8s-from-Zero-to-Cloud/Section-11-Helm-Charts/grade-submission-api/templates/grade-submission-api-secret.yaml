#
# Description:
# Helm template for a Kubernetes Secret that provides credentials for the 
# grade-submission-api microservice to connect securely to MongoDB.
#
# This Secret:
# - Stores sensitive data (MongoDB username and password) as base64-encoded values.
# - Supplies credentials via environment variables or mounted volumes within the pod.
# - Uses type Opaque to store generic key-value pairs securely.
# - Leverages Helm templating to dynamically name the Secret and assign values.
# ------------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.microservice.name }}-secret
  namespace: {{ .Values.microservice.namespace }}
type: Opaque
data:
  MONGODB_USER: {{ .Values.secrets.MONGODB_USER }}
  MONGODB_PASSWORD: {{ .Values.secrets.MONGODB_PASSWORD }}