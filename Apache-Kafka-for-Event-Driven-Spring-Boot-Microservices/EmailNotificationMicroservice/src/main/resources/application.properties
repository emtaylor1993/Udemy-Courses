

# Logical application name used in logs, metrics and service discovery.
spring.application.name=emailnotificationmicroservice

# Bind to a random available port to avoid conflicts when running multiple instances.
server.port=0

# -----------------------------------------------------------------------------
# KAFKA - BROKER CONNECTION
# -----------------------------------------------------------------------------

# Comma-separated list of Kafka bootstrap servers the consumer uses to discover the cluster
spring.kafka.consumer.bootstrap-servers=localhost:9092,localhost:9094,localhost:9096

# -----------------------------------------------------------------------------
# KAFKA - PRODUCER SERIALIZATION
# -----------------------------------------------------------------------------

# Key deseralizer class for Kafka consumer.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Value deserializer class for Kafka consumer.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# -----------------------------------------------------------------------------
# KAFKA - CONSUMER GROUP / IDENTITY
# -----------------------------------------------------------------------------

# Consumer group identifier.
# - All instances with the same group ID share the work.
# - Changing the group ID causes the app to consume independently as a separate group.
spring.kafka.consumer.group-id=product-created-events

# -----------------------------------------------------------------------------
# KAFKA - JSON DESERIALIZATION SAFETY
# -----------------------------------------------------------------------------

# Packages allowed the JSON deserialization. Prevents JSON Deserializer from instantiating
# arbitrary classes from untrusted packages.
spring.kafka.consumer.properties.spring.json.trusted.packages=core