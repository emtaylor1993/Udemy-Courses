# =============================================================================
# PRODUCTS MICROSERVICE - APPLICATION CONFIGURATION
# Author: Emmanuel Taylor
#
# Responsibilities:
#  - Defines core Spring Boot application settings (name, server port).
#  - Configures Kafka producer connectivity and reliability-related properties.
#
# Notes:
#  - server.port=0 binds to a random available port (useful for local runs/tests or multiple instances).
#  - Kafka broker list should match your local/docker cluster listener ports.
# =============================================================================

# Logical application name used in logs, metrics and service discovery.
spring.application.name=productsmicroservice

# Bind to a random available port to avoid conflicts when running multiple instances.
server.port=0

# -----------------------------------------------------------------------------
# KAFKA - BROKER CONNECTION
# -----------------------------------------------------------------------------

# Comma-separated list of Kafka bootstrap servers the producer uses to discover the cluster
spring.kafka.bootstrap-servers=localhost:9092,localhost:9094,localhost:9096

# -----------------------------------------------------------------------------
# KAFKA - PRODUCER SERIALIZATION
# -----------------------------------------------------------------------------

# Key serializer class for Kafka producer.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Value serializer class for Kafka producer.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# -----------------------------------------------------------------------------
# KAFKA - PRODUCER DURABILITY / DELIVERY BEHAVIOR
# -----------------------------------------------------------------------------

# Acknowledgment level for producer requests (all replicas must acknowledge).
spring.kafka.producer.acks=all

# Enabled to avoid duplicates on retries when used with acks=all.
spring.kafka.producer.properties.enable.idempotence=true

# Limits in-flight requests to preserve ordering during retries.
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Number of retries for failed send attempts.
# spring.kafka.producer.retries=10

# Additional producer properties for fine-tuning delivery guarantees.
# spring.kafka.producer.properties.retry.backoff.ms=1000

# Maximum time to wait for delivery before timing out.
spring.kafka.producer.properties.delivery.timeout.ms=120000

# Linger time to batch records before sending (0 means no delay).
spring.kafka.producer.properties.linger.ms=0

# Network request timeout for the producer.
spring.kafka.producer.properties.request.timeout.ms=30000